<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hover beside a slideshow planted</title><style>body{font:16px sans-serif;margin:20px}.carousel{width:600px;height:200px;position:relative;overflow:hidden}.slide{position:absolute;inset:0;color:#fff;font-size:32px;padding:40px;display:none}.slide.on{display:block}body{margin:40px}.trigger{display:inline-block;padding:4px;border:1px solid #666}.tip{display:none;position:absolute;left:40px;top:320px;width:220px;background:#222;color:#fff;padding:8px}.trigger:hover + .tip{display:block}</style></head><body>
<div class="carousel"><div class="slide" style="background:#c33">Summer sale</div><div class="slide" style="background:#36c">New collection</div><div class="slide" style="background:#393">Free returns</div></div><p>Shipping costs <span class="trigger" tabindex="0">?</span><span class="tip" role="tooltip">Shipping is free above 50 euros, otherwise 4.90 euros.</span></p><p>Other text below the tip.</p><script>const s=[...document.querySelectorAll('.slide')];let i=0;s[0].classList.add('on');window.__t=setInterval(()=>{s[i].classList.remove('on');i=(i+1)%s.length;s[i].classList.add('on')},300);</script>
</body></html>
