<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hover clean</title><style>body{font:16px sans-serif;margin:20px}body{margin:40px}.wrap{position:relative;display:inline-block}.trigger{display:inline-block;padding:4px;border:1px solid #666}.tip{display:none;position:absolute;left:0;top:100%;width:220px;background:#222;color:#fff;padding:8px}.wrap:hover .tip,.wrap:focus-within .tip{display:block}.wrap.closed .tip{display:none!important}</style></head><body>
<p>Shipping costs <span class="wrap"><span class="trigger" tabindex="0">?</span><span class="tip" role="tooltip">Shipping is free above 50 euros, otherwise 4.90 euros.</span></span></p><p>Other text below the tip.</p>
<script>const w=document.querySelector('.wrap');document.addEventListener('keydown',e=>{if(e.key==='Escape')w.classList.add('closed')});w.addEventListener('mouseleave',()=>w.classList.remove('closed'));</script>
</body></html>
