<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ticker clean</title><style>body{font:16px sans-serif;margin:20px}body{margin:0}.band{margin-top:40px;height:80px;overflow:hidden;white-space:nowrap;background:#123;color:#fff;font-size:32px;line-height:80px}#news{display:inline-block}</style></head><body>
<section><div class="band"><span id="news">Breaking: new opening hours from Monday — free delivery this week — new menu items every Friday</span></div><button id="p">Pause news</button></section><p>Text after the news.</p><script>const n=document.getElementById('news');let x=0;(function step(){if(!window.__stop){x=(x-3)%1400;n.style.transform='translateX('+x+'px)';}requestAnimationFrame(step);})();document.getElementById('p').onclick=()=>{window.__stop=true};</script>
</body></html>
