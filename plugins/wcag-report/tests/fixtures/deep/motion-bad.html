<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Motion planted</title><style>body{font:16px sans-serif;margin:20px}.carousel{width:600px;height:200px;position:relative;overflow:hidden}.slide{position:absolute;inset:0;color:#fff;font-size:32px;padding:40px;display:none}.slide.on{display:block}</style></head><body>
<div class="carousel"><div class="slide" style="background:#c33">Summer sale</div><div class="slide" style="background:#36c">New collection</div><div class="slide" style="background:#393">Free returns</div></div><p>Text after the slideshow.</p><script>const s=[...document.querySelectorAll('.slide')];let i=0;s[0].classList.add('on');window.__t=setInterval(()=>{s[i].classList.remove('on');i=(i+1)%s.length;s[i].classList.add('on')},1500);</script>
</body></html>
